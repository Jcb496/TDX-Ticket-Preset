<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDX Presets settings</title><style>body{font:15px system-ui;max-width:650px;margin:40px auto;padding:0 20px;color:#202124}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;box-sizing:border-box;padding:10px}button{margin:12px 8px 0 0;padding:9px 14px;cursor:pointer}#status{white-space:pre-wrap}small{color:#555}</style></head><body><h1>TDX Presets settings</h1><p>Publish a JSON preset file to an HTTPS URL you control, then paste its direct URL below. No remote JavaScript is executed.</p><label for="url">Central preset JSON URL</label><input id="url" type="url" placeholder="https://example.org/tdx/presets.json"><small>Leave blank to use bundled presets. This URL is shared with the remote host when checking for updates. Do not put private ticket data in the JSON file.</small><div><button id="save">Save configuration URL</button><button id="check">Check for updates now</button><button id="clear">Use bundled presets</button></div><p id="status" role="status"></p><script src="options.js"></script></body></html>
