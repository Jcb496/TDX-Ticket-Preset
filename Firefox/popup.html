<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDX Presets</title><style>
*{box-sizing:border-box}body{margin:0;width:320px;background:#071629;color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif;padding:17px}header{display:flex;align-items:center;gap:12px}.logo{height:48px;width:48px;display:grid;place-items:center;background:#10253d;border:1px solid #25435d;border-radius:11px;font-size:18px;font-weight:800;letter-spacing:-.5px}.heading{flex:1}h1{font-size:16px;margin:0 0 3px}.version{font-size:12px;color:#a4b5c8}button{cursor:pointer}#toggle{width:46px;height:26px;border:0;border-radius:20px;background:#0891b2;padding:3px;display:flex;align-items:center;justify-content:flex-end}#toggle[aria-checked="false"]{background:#526779;justify-content:flex-start}.knob{width:20px;height:20px;background:white;border-radius:50%}hr{border:0;border-top:1px solid #25435d;margin:17px 0}.status{display:flex;align-items:center;gap:10px}.status-symbol{color:#22d3ee;font-size:20px}.status strong{display:block;font-size:13px}.sub{font-size:12px;color:#a4b5c8;margin-top:3px}.help{background:#10253d;border-radius:7px;padding:13px;margin-top:19px}.help strong{font-size:12px}.help p{color:#b6c8d8;font-size:12px;line-height:1.5;margin:5px 0 0}#settings{display:block;width:100%;margin-top:13px;padding:12px;border:0;border-radius:7px;background:#155e75;color:white;font-weight:650}#settings:hover{background:#18758f}button:focus-visible{outline:2px solid #67e8f9;outline-offset:3px}
</style></head><body><header><div class="logo" aria-hidden="true">TDX</div><div class="heading"><h1>TDX Presets</h1><div id="version" class="version"></div></div><button id="toggle" type="button" role="switch" aria-label="Enable TDX Presets" aria-checked="true"><span class="knob"></span></button></header><hr><section class="status" aria-live="polite"><span id="symbol" class="status-symbol">✓</span><div><strong id="status">Extension Enabled</strong><div id="subtitle" class="sub">Your TDX preset toolbar is active.</div></div></section><section class="help"><strong>How to use</strong><p>Open a TDX ticket in edit mode to access your presets.</p></section><button id="settings" type="button">⚙ &nbsp; Extension Settings</button><script src="popup.js"></script></body></html>
